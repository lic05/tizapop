<meta name="theme-color" content="#fdf8f2">
<title>Tizapop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: tienda escolar de colores. Encabezado con franja arcoíris, botones en píldora, mosaicos de color por materia. Tema claro único, a propósito. */
:root{
  color-scheme:light;
  --bg:#fdf8f2; --soft:#f4effa; --ink:#2e2550; --muted:#7a7391; --line:#ebe7f3;
  --turq:#3fc6c4; --pink:#cf62cc; --yellow:#f3b93c; --green:#7cc443; --coral:#ff6f6f; --purple:#8d6fe0; --blue:#4fa3ec; --wa:#25c26a;
  --display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button{font-family:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.bar{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.logo svg{width:52px;height:40px;flex:none}
.logo b{font-family:var(--display);font-size:22px;line-height:1;display:block}
.logo small{font-size:12px;color:var(--muted);font-weight:700}
.top{background:rgba(253,248,242,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar{justify-content:space-between}
.logo b{font-size:28px;letter-spacing:-.01em}
.burger{border:0;background:none;width:44px;height:44px;display:grid;place-content:center;gap:5px;cursor:pointer;border-radius:12px}
.burger span{display:block;width:26px;height:3.5px;border-radius:3px;background:var(--ink)}
.burger:focus-visible,.menu button:focus-visible,.tabbar button:focus-visible,.door2:focus-visible,.feat button:focus-visible,.cta:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.menu{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:4px 14px;display:grid;gap:6px}
.menu button{border:0;background:#fff;border-radius:14px;padding:12px 16px;text-align:left;font:800 16px var(--body);color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(60,50,90,.08)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:#fff;border-top-left-radius:26px;border-top-right-radius:26px;box-shadow:0 -6px 24px rgba(60,50,90,.1);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;border-radius:999px;padding:10px 6px;display:flex;align-items:center;justify-content:center;gap:8px;font:800 16px var(--body);color:var(--muted);cursor:pointer}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor}
.tabbar button:first-child svg{fill:currentColor;stroke:none}
.tabbar button.on{background:#efe3fb;color:#8d4fd1}
.fab{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
main{padding-block:10px 120px}
.hero{position:relative;display:grid;grid-template-columns:1fr;gap:6px;padding-block:6px 4px;overflow:hidden}
@media (min-width:700px){.hero{grid-template-columns:1.1fr .9fr;align-items:center}}
.hero h1{font-size:clamp(34px,8.5vw,56px);line-height:1.02;letter-spacing:-.01em;position:relative;z-index:1}
.hero h1 .w1{color:#a35ad6}.hero h1 .w2{color:#2fb8b4}.hero h1 .w3{color:#ff6b6b}
.hero p{margin:6px 0 0;color:var(--muted);font-weight:700;font-size:18px;max-width:30ch;position:relative;z-index:1}
.hero .art{position:relative;z-index:1;justify-self:end;width:min(320px,62vw);margin-top:-36px}
@media (min-width:700px){.hero .art{margin-top:0;width:100%;max-width:400px}}
.hero .art svg{width:100%;height:auto;display:block}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55;pointer-events:none}
.cta{border:0;border-radius:999px;background:#2fb8b4;color:#fff;font:800 clamp(16px,4.3vw,20px) var(--body);letter-spacing:.03em;text-transform:uppercase;padding:16px 20px;cursor:pointer;box-shadow:0 6px 0 #23938f,0 10px 20px rgba(47,184,180,.3);position:relative}
.sbox{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #c98be8;border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 6px 18px rgba(160,90,214,.12)}
.sbox svg{width:26px;height:26px;flex:none;stroke:var(--ink);fill:none}
.sbox input{flex:1;min-width:0;border:0;outline:none;font:700 18px var(--body);color:var(--ink);background:transparent;padding:10px 0}
.sbox input::placeholder{color:#8b84a3}
.sbox button{border:0;width:58px;height:46px;border-radius:999px;background:#c35fd0;display:grid;place-items:center;cursor:pointer}
.sbox button svg{stroke:#fff}
.sbox:focus-within{box-shadow:0 0 0 4px rgba(201,139,232,.35)}
.lv2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lv2 button{border:0;border-radius:999px;padding:16px;font:800 22px var(--display);cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.06)}
.lv2 .k{background:#c35fd0;color:#fff}.lv2 .p{background:#fbe39b;color:var(--ink)}
.lv2 button[aria-pressed="false"]{opacity:.5}
.grades .gpill{padding:9px 16px;font-size:15px}
.doors2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.doors2 .wide{grid-column:1/-1}
.door2{border:0;border-radius:26px;padding:18px 16px;text-align:left;cursor:pointer;position:relative;overflow:hidden;min-height:190px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.door2 h3{font-size:clamp(20px,5.2vw,28px);position:relative;z-index:1;max-width:80%}
.door2 p{margin:0;color:#6c6589;font-weight:700;font-size:15px;max-width:60%;position:relative;z-index:1}
.door2 .go{margin-top:auto;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(60,50,90,.12);position:relative;z-index:1}
.door2 .go svg{width:22px;height:22px;stroke:var(--ink);fill:none}
.door2 .ill{position:absolute;right:-6px;bottom:-6px;width:56%;max-width:170px;height:auto}
.door2.wide{min-height:150px}.door2.wide .ill{width:34%;max-width:150px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sechead h2{font-size:clamp(24px,6vw,32px)}
.vermas{border:0;background:#efe3fb;color:var(--ink);border-radius:999px;padding:8px 16px;font:800 15px var(--body);cursor:pointer}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (min-width:760px){.feat{grid-template-columns:repeat(4,1fr)}}
.fcard{background:#fff;border-radius:22px;padding:10px;display:grid;gap:8px;box-shadow:0 4px 16px rgba(60,50,90,.08);position:relative;min-width:0}
.fcard .th{border-radius:14px;overflow:hidden;aspect-ratio:1/1;background:#fff;border:1.5px dashed #d8d2e6;line-height:0;cursor:pointer}
.fcard .th svg{width:100%;height:auto;display:block}
.fcard .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.fcard b{font-family:var(--display);font-size:17px;line-height:1.15}
.fcard .dl2{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#c9f0ec;display:grid;place-items:center;cursor:pointer}
.fcard .dl2 svg{width:22px;height:22px;stroke:#1f8f8a;fill:none}
.fcard .stk{position:absolute;left:4px;top:2px;width:30px;height:30px}
.stripe{height:6px;background:linear-gradient(90deg,var(--coral) 0 12.5%,#ff9f43 12.5% 25%,var(--yellow) 25% 37.5%,var(--green) 37.5% 50%,var(--turq) 50% 62.5%,var(--purple) 62.5% 75%,var(--pink) 75% 87.5%,#ff5c8a 87.5%)}
main{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
.pill{border:0;border-radius:999px;padding:14px 20px;font:800 17px var(--body);letter-spacing:.04em;text-transform:uppercase;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.08),0 6px 14px rgba(60,50,90,.12);transition:transform .12s}
.pill:active{transform:translateY(2px)}
.pill:focus-visible,.tile:focus-visible,.topic:focus-visible,.fbtn:focus-visible,.gpill:focus-visible,.back:focus-visible,.fab:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.levels .wide{grid-column:1/-1}
.pill[aria-pressed="false"]{opacity:.45}
.search{width:100%;border:3px solid var(--pink);border-radius:999px;padding:13px 22px;font:700 17px var(--body);color:var(--ink);background:#fff}
.search::placeholder{color:var(--pink);opacity:.8}
.search:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(207,98,204,.25)}
.grades{display:flex;flex-wrap:wrap;gap:8px}
.gpill{border:2.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:800 15px var(--body);color:var(--ink);cursor:pointer}
.gpill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.hint{color:var(--muted);font-weight:700;font-size:14px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border:0;border-radius:18px;aspect-ratio:1/1;color:#fff;text-align:left;padding:14px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 16px rgba(60,50,90,.14);max-width:100%}
.tile h3{font-size:clamp(20px,5.2vw,28px);text-shadow:0 2px 0 rgba(0,0,0,.12);position:relative;z-index:1}
.tile .n{font:800 13px var(--body);background:rgba(255,255,255,.95);color:var(--ink);border-radius:999px;padding:4px 10px;align-self:flex-start;position:relative;z-index:1}
.tile svg{position:absolute;right:-6%;bottom:-4%;width:66%;height:auto;opacity:.95}
.tile:hover{transform:translateY(-2px)}

.gwin{display:grid;gap:10px;justify-items:center;text-align:center;background:#fff;border-radius:24px;padding:28px;box-shadow:var(--sh)}.gwin h2{margin:0;font-size:34px}.gwin p{margin:0}

@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.mcard span{transition:none}.gstar{animation:none}}
/* ---------- animaciones ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:3px;animation:fall 2.3s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--x),106vh) rotate(var(--r))}}
.btnp,.btns,.pill,.tool,.tile,.door2,.qcard,.fcard,.pband,.qop,.gthumb,.gpill,.back,.favbtn,.fbtn,.vermas{transition:transform .2s cubic-bezier(.2,.8,.2,1.3),box-shadow .25s ease,background-color .2s ease,filter .2s ease}
@media (prefers-reduced-motion:no-preference){
  #app.enter{animation:viewIn .45s cubic-bezier(.2,.8,.2,1) both}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .rv{opacity:0;transform:translateY(18px) scale(.97);transition:opacity .5s ease var(--d,0ms),transform .6s cubic-bezier(.2,.8,.2,1.15) var(--d,0ms),box-shadow .25s ease}
  .rv.in{opacity:1;transform:none}
  .hero h1 .w1,.hero h1 .w2,.hero h1 .w3{display:inline-block;animation:wordPop .7s cubic-bezier(.2,.8,.2,1.35) both}
  .hero h1 .w1{animation-delay:.12s}.hero h1 .w2{animation-delay:.24s}.hero h1 .w3{animation-delay:.36s}
  @keyframes wordPop{from{opacity:0;transform:translateY(18px) scale(.8)}}
  .hero .eyebrow,.hero p,.hero .hbtns,.hero .stats{animation:viewIn .6s cubic-bezier(.2,.8,.2,1) both}
  .hero p{animation-delay:.35s}.hero .hbtns{animation-delay:.45s}.hero .stats{animation-delay:.55s}
  .hero .art svg{animation:floaty 6s ease-in-out infinite}
  @keyframes floaty{50%{transform:translateY(-8px)}}
  .hero .art svg > path{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
  .hero .art svg > path:nth-of-type(2){animation-delay:.9s}
  @keyframes twinkle{50%{transform:scale(1.3) rotate(14deg);opacity:.7}}
  .hero .art svg > g:nth-of-type(3){transform-box:fill-box;transform-origin:50% 100%;animation:bob 3.4s ease-in-out infinite}
  .hero .art svg > g:nth-of-type(4){transform-box:fill-box;transform-origin:50% 100%;animation:bob 4s ease-in-out .6s infinite}
  @keyframes bob{50%{transform:rotate(-3deg) translateY(-4px)}}
  .door2 .ill{transition:transform .35s cubic-bezier(.2,.8,.2,1.4)}
  .pband{background-size:220% 220%;animation:grad 9s ease infinite;position:relative;overflow:hidden}
  @keyframes grad{50%{background-position:100% 50%}}
  .pband::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.28) 50%,transparent 62%);transform:translateX(-110%);animation:shine 5s ease-in-out infinite;pointer-events:none}
  .pband.jb::after{animation-delay:2.5s}
  @keyframes shine{55%,100%{transform:translateX(110%)}}
  .pband i{animation:nudge 1.8s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateX(4px)}}
  .gload{background:linear-gradient(90deg,var(--soft) 25%,#fff 50%,var(--soft) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite}
  @keyframes sk{to{background-position:-200% 0}}
  .lk-ic{animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 12px rgba(255,210,63,.22)}}
  .sheet > svg{animation:sheetIn .45s cubic-bezier(.2,.8,.2,1) both}
  @keyframes sheetIn{from{opacity:0;transform:scale(.97) translateY(6px)}}
  .tabbar button.on svg{animation:tabPop .45s cubic-bezier(.2,.8,.2,1.5)}
  @keyframes tabPop{from{transform:scale(.6)}}
  .qop.ok,.mcard.ok .front{animation:bounce .5s cubic-bezier(.2,.8,.2,1.4)}
  .qop.no{animation:shake .4s}
  @keyframes bounce{40%{transform:scale(1.1)}}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .plushero .price b{animation:wordPop .7s .15s cubic-bezier(.2,.8,.2,1.35) both}
  .plushero .btnp.big{animation:glow 2.6s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 0 9px rgba(169,110,240,.2)}}
  .codebox b{animation:wordPop .7s cubic-bezier(.2,.8,.2,1.35) both}
  .banner{position:relative;overflow:hidden}
  .banner::before{content:"";position:absolute;width:140px;height:140px;border-radius:50%;right:-40px;top:-50px;background:rgba(255,255,255,.35);animation:floaty 7s ease-in-out infinite;pointer-events:none}
  .banner::after{content:"";position:absolute;width:60px;height:60px;border-radius:50%;right:70px;bottom:-26px;background:rgba(255,255,255,.28);animation:floaty 5s ease-in-out 1s infinite;pointer-events:none}
}
@media (hover:hover){
  .tool:hover,.tile:hover,.door2:hover,.fcard:hover,.pband:hover,.qcard:hover{transform:translateY(-4px);box-shadow:0 4px 8px rgba(46,37,80,.08),0 20px 40px rgba(46,37,80,.15)}
  .door2:hover .ill{transform:rotate(-6deg) scale(1.06)}
  .tile:hover svg{animation:wiggle .6s ease}
  .btnp:hover,.pill:hover,.qop:hover{transform:translateY(-2px);filter:brightness(1.05)}
  .gthumb:hover{transform:translateY(-3px) rotate(-1deg)}
  @keyframes wiggle{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
}
.btnp:active,.btns:active,.pill:active,.tool:active,.tile:active,.door2:active,.qcard:active,.fcard:active,.pband:active,.qop:active,.gthumb:active,.back:active,.gpill:active{transform:scale(.96)}
#app{grid-template-columns:minmax(0,1fr)}#app>*,.studio>*{min-width:0}
.lockc{line-height:1.4;white-space:normal;display:grid;gap:10px;justify-items:center;text-align:center;padding:24px;max-width:340px}.lockc h3{margin:0;font-size:20px}.lockc p{margin:0;font-size:14px;color:#6d6585}
.lk-ic{width:56px;height:56px;border-radius:50%;background:#ffd23f;color:#2e1a47;display:grid;place-items:center;font-size:28px}
.gthumb.lkd svg{opacity:.45;filter:blur(1.5px)}
.sitefoot{margin:34px 0 8px;padding:18px 8px 6px;border-top:1px solid rgba(60,50,90,.12);text-align:center;font:600 13px var(--body);color:#6b6880}.sitefoot p{margin:4px 0}.sitefoot a{color:var(--ink);text-decoration:underline}.sitefoot .sm{font-size:11.5px;opacity:.8}
.lgtabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.lgtabs button{border:0;border-radius:999px;padding:9px 14px;font:800 13.5px var(--body);background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(60,50,90,.08);cursor:pointer}.lgtabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.legal{background:#fff;border-radius:22px;padding:22px 20px;box-shadow:0 4px 18px rgba(60,50,90,.07);font:500 15px/1.6 var(--body);color:#35324a;max-width:780px}.legal h1{font:900 24px/1.2 var(--display, var(--body));margin:0 0 4px;color:var(--ink)}.legal h2{font:800 17px var(--body);margin:20px 0 6px;color:var(--ink)}.legal .upd{color:#8a879a;font-size:13px;margin:0 0 12px}.legal ul,.legal ol{padding-left:20px}.legal li{margin:6px 0}.legal mark{background:#fff1a8;padding:0 4px;border-radius:4px}.legal a{color:#7a3fd1}
.consent{font-size:12.5px;margin-top:10px}.consent a{color:inherit;text-decoration:underline}
</style>

  <form class="share" id="shareForm" novalidate>
    <h2 id="dlgTitle" style="font-size:24px">Compartir un recurso</h2>
    <label for="f-titulo">Título <input type="text" id="f-titulo" maxlength="90" placeholder="Memorama de animales y sus crías"></label>
    <div class="two">
      <label for="f-areasel">Materia <select id="f-areasel"></select></label>
      <label for="f-nivelsel">Nivel <select id="f-nivelsel"><option>Preescolar</option><option selected>Primaria</option></select></label>
    </div>
    <div class="two">
      <label for="f-tiposel">Tipo <select id="f-tiposel"></select></label>
      <label for="f-grado">Grado <input type="text" id="f-grado" maxlength="30" placeholder="2.º de primaria"></label>
    </div>
    <label for="f-desc">¿Cómo se usa? <textarea id="f-desc" maxlength="400" placeholder="Imprimir en cartulina, recortar y jugar en equipos de 4."></textarea></label>
    <label for="f-file">Archivo (PDF o imagen) <input type="file" id="f-file" accept="application/pdf,image/png,image/jpeg,image/webp"></label>
    <p class="msg" id="formMsg"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
      <button class="back" type="button" id="cancel">Cancelar</button>
      <button class="pill" style="background:var(--pink);padding:12px 20px" type="submit" id="submitBtn">Publicar</button>
    </div>
  </form>
</dialog>

<script>/* Motor del generador: arma una lista de operaciones de dibujo (tamaño carta, puntos, origen arriba-izquierda). */

      { t: "Relato: ¿cómo vivimos el Consejo Técnico Escolar?", intro: "En nuestro {ESC} el CTE es el espacio donde el colectivo se detiene a mirar lo que pasa en las aulas, comparte lo que sabe y decide en conjunto cómo mejorar los aprendizajes y el bienestar de {AL}. Reconocemos que en varias sesiones lo urgente desplazó a lo importante; este ciclo queremos cuidar un tiempo protegido para lo pedagógico, terminar cada sesión con acuerdos claros y darles seguimiento.", cols: QA, w: qw, rows: [
        ["¿Qué sentido tiene el CTE para nosotros?", "Es nuestro espacio colegiado para pensar juntos la práctica docente, tomar decisiones con base en evidencias y construir un proyecto común centrado en {AL}."],
        ["¿Qué acuerdos nos han ayudado a organizar el currículo?", "Revisar el Programa Analítico a partir del diagnóstico, ajustar la planeación a los intereses y necesidades de cada {GR} y compartir proyectos entre docentes."],

        ["¿Qué asuntos abordó el colectivo y a cuáles dio prioridad?", "Se mezclaron el tema pedagógico planeado, una indicación externa y un trámite administrativo. En la práctica pesaron más los asuntos externos y el tema pedagógico quedó sin cerrar."],

      else if (o.t === "circle") s += `<circle cx="${o.x}" cy="${o.y}" r="${o.r}" fill="${o.fill||"none"}"${o.stroke?` stroke="${o.stroke}" stroke-width="${o.lw||1}"`:""}/>`;
      else if (o.t === "ellipse") s += `<ellipse cx="${o.x}" cy="${o.y}" rx="${o.rx}" ry="${o.ry}" fill="${o.fill||"none"}"${o.stroke?` stroke="${o.stroke}" stroke-width="${o.lw||1}"`:""}/>`;
      else if (o.t === "poly") s += `<${o.closed?"polygon":"polyline"} points="${o.pts.map(p => p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="${o.closed&&o.fill?o.fill:"none"}"${o.stroke?` stroke="${o.stroke}" stroke-width="${o.lw||1}" stroke-linejoin="round" stroke-linecap="round"`:""}${o.dash?` stroke-dasharray="${o.dash.join(" ")}"`:""}/>`;
    }
    return s + "</svg>";
  }

  let built = null;
  function vRes(){
    const t = S.topic;
    app.appendChild(el(`<div class="head"><button class="back" id="bk" type="button">‹ ${S.from === "listos" ? "Biblioteca" : S.from === "home" ? "Inicio" : esc(t.materia)}</button></div>`));
    $("#bk").onclick = () => { if (S.from === "area") S.area = t.materia; go(S.from === "res" ? "home" : S.from); };
    app.appendChild(el(`<div class="banner ${ACLS(t.materia)}"><h2>${esc(RB.FORMATOS[S.formato])}: ${esc(t.titulo)}</h2><p>${esc(RB.GRADOS[S.grado2])} · Versión ${S.version} de ${RB.VERSIONES}</p></div>`));
    const studio = el(`<div class="studio">
      <div class="sheetwrap"><div class="sheet" id="sheet" aria-label="Vista previa"></div><div class="pager" id="pager"></div></div>
      <div class="side">
        <button class="pill dl" id="dl" type="button">Descargar PDF</button>
        <p class="status" id="st" role="status"></p>
        <button class="pill alt" id="nx" type="button">Otra versión</button>
        <div><p class="hint" style="margin-bottom:6px">Mismo tema en otro formato</p><div class="switch" id="sw"></div></div>
        <div><p class="hint" style="margin-bottom:6px">Grado</p><div class="grades" id="gsw"></div></div>
        <button class="pill rnd" id="rn" type="button">Sorpréndeme</button>
      </div></div>`);
    app.appendChild(studio);
    const sd = app.querySelector(".side"); sd.insertBefore(fontSwitch(), sd.children[2]); sd.insertBefore(favButton(), sd.children[2]);
    RB.formatos(t).forEach(f => { const b = document.createElement("button"); b.type = "button"; b.className = "fbtn f-" + f; b.textContent = RB.FORMATOS[f]; if (f === S.formato) b.style.outline = "3px solid var(--ink)"; b.onclick = () => { S.formato = f; S.page = 0; render(); }; $("#sw").appendChild(b); });
    t.grados.forEach(g => { const b = document.createElement("button"); b.type = "button"; b.className = "gpill"; b.textContent = (g[0]==="K"?"K":"P") + GL[g]; b.title = RB.GRADOS[g]; b.setAttribute("aria-pressed", g === S.grado2); b.onclick = () => { S.grado2 = g; S.page = 0; render(); }; $("#gsw").appendChild(b); });
    $("#nx").onclick = () => { S.version = S.version % RB.VERSIONES + 1; S.page = 0; render(); };
    $("#rn").onclick = () => { const pool = CONTENT.filter(inScope); const r = pool[Math.floor(Math.random()*pool.length)]; const gs = r.grados.filter(g => gradesOfLevel().includes(g)); const fs = RB.formatos(r); S.topic = r; S.grado2 = gs[Math.floor(Math.random()*gs.length)] || r.grados[0]; S.formato = fs[Math.floor(Math.random()*fs.length)]; S.version = 1 + Math.floor(Math.random()*(isPlus() ? RB.VERSIONES : FREEV)); S.page = 0; render(); };
    $("#dl").onclick = () => savePdf();
    if (!downloadsReady()) { $("#dl").disabled = true; $("#dl").style.opacity = ".5"; setSt(window.claude && window.claude.use ? "Cargando descargas…" : "Abre la página en Claude para descargar.", false); }
    built = withF(() => RB.build(t, S.grado2, S.formato, S.version));
    drawSheet();
    app.appendChild(gallery("Elige una versión", RB.VERSIONES, v => withF(() => RB.build(t, S.grado2, S.formato, v)), [t.id, S.grado2, S.formato, TS.font || ""].join("|")));
  }
  function drawSheet(){
    const why = lockWhy(); if (why) { const sh = $("#sheet"); sh.textContent = ""; sh.classList.add("locked"); sh.appendChild(lockCard(why)); $("#pager").textContent = ""; return; }
    const n = built.pages.length; if (S.page >= n) S.page = 0;
    $("#sheet").innerHTML = svgPage(built.pages[S.page]);
    const pg = $("#pager"); pg.textContent = "";
    if (n > 1){
      const p = document.createElement("button"); p.type = "button"; p.textContent = "‹"; p.setAttribute("aria-label","Hoja anterior"); p.onclick = () => { S.page = (S.page - 1 + n) % n; drawSheet(); };
      const x = document.createElement("button"); x.type = "button"; x.textContent = "›"; x.setAttribute("aria-label","Hoja siguiente"); x.onclick = () => { S.page = (S.page + 1) % n; drawSheet(); };
      const s = document.createElement("span"); s.textContent = `Hoja ${S.page + 1} de ${n}`; pg.append(p, s, x);
    } else pg.textContent = "1 hoja";
  }
  function setSt(t, err){ const s = $("#st"); if (!s) return; s.textContent = t; s.className = "status" + (err ? " err" : ""); }

  let downloads = null, capsDone = false;
  const standalone = !(window.claude && window.claude.use);
  const downloadsReady = () => !!downloads || standalone;
  let jsPDFp = null;
  function loadJsPDF(){
    if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
    if (!jsPDFp) jsPDFp = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; s.onload = () => window.jspdf ? res(window.jspdf.jsPDF) : rej(new Error("load")); s.onerror = () => { jsPDFp = null; rej(new Error("load")); }; document.head.appendChild(s); });
    return jsPDFp;
  }
  async function dlText(text, filename, mime, btn){
    const old = btn.textContent; btn.textContent = "Preparando…"; btn.disabled = true;
    try { const data = new TextEncoder().encode("\ufeff" + text);
      if (downloads) await downloads.save({ filename, data: data.buffer });
      else { const u = URL.createObjectURL(new Blob([data], { type: mime })), a = document.createElement("a"); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }
      btn.textContent = "¡Listo!"; confetti(30); } catch (e) { btn.textContent = e && e.code === "declined" ? "Cancelado" : "No se pudo"; }
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2500);
  }
  async function dlBuilt(b, btn){
    const old = btn.textContent; btn.textContent = "Preparando…"; btn.disabled = true;
    try { const J = await loadJsPDF(); const doc = RB.toJsPDF(J, b);
      if (downloads) await downloads.save({ filename: b.filename, data: doc.output("arraybuffer") }); else doc.save(b.filename);
      btn.textContent = "¡Listo!"; confetti(30); } catch (e) { btn.textContent = e && e.code === "declined" ? "Cancelado" : "No se pudo"; }
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2500);
  }
  async function savePdf(){
    if (lockWhy()) { go("plus"); return; }
    if (!downloads && !standalone) return;
    setSt("Preparando tu PDF…");
    try {
      const J = await loadJsPDF();
      if (!downloads) { RB.toJsPDF(J, built).save(built.filename); setSt("¡Listo! Revisa tus descargas."); confetti(40); return; }
      await downloads.save({ filename: built.filename, data: RB.toJsPDF(J, built).output("arraybuffer") });
      setSt("¡Listo! Ya se guardó tu PDF."); confetti(40);
    } catch (e) {
      const c = e && e.code;
      setSt(c === "declined" ? "Descarga cancelada." : c === "rate_limited" ? "Ya hay una descarga abierta. Termínala primero." : e && e.message === "load" ? "No se pudo preparar el PDF. Revisa tu internet." : "No se pudo descargar. Inténtalo otra vez.", c !== "declined");
    }
  }

  // ---------- biblioteca ----------
  let notice = "";
  const L = { items: [], area: null, shown: 24, me: null, canEdit: false, loaded: false };
  let db = null, assets = null, user = null;
  const thumbCache = {};
  function vListos(){
    app.appendChild(el(`<div class="head"><button class="back" id="bk" type="button">‹ Inicio</button></div>`)); $("#bk").onclick = () => go("home");
    app.appendChild(el(`<div class="banner c-listos"><h2>Ya listos para descargar</h2><p>Recursos preparados y los que comparten otros docentes</p></div>`));
    if (notice) app.appendChild(el(`<p class="notice">${esc(notice)}</p>`));
    const sw = document.createElement("div"); sw.className = "switch";
    [null, ...AREAS].forEach(a => { const b = document.createElement("button"); b.type = "button"; b.className = "fbtn"; b.style.background = a ? ACOL[a] : "var(--ink)"; b.textContent = a || "Todas"; if (L.area === a) b.style.outline = "3px solid var(--ink)"; if (L.area === a) b.style.outlineOffset = "2px"; b.onclick = () => { L.area = a; L.shown = 24; render(); }; sw.appendChild(b); });
    app.appendChild(sw);
    const list = L.items.filter(r => !L.area || (r.area || r.materia) === L.area);
    if (!L.loaded) { app.appendChild(el(`<p class="notice">Cargando la biblioteca…</p>`)); return; }
    app.appendChild(el(`<p class="hint">${fmtN(list.length)} recursos</p>`));
    const grid = document.createElement("div"); grid.className = "lib"; app.appendChild(grid);
    list.slice(0, L.shown).forEach(r => {
      const src = r.assetUrl || (r.assetId ? "/_blob/" + r.assetId : "");
      const color = ACOL[r.area || r.materia] || "var(--ink)";
      const c = el(`<article class="card"><div class="thumb"></div><div class="row"><span class="tag" style="background:${color}">${esc(r.tipo || "Recurso")}</span><span class="hint" style="font-size:12.5px">${esc(r.grado || r.nivel || "")}</span></div><h3>${esc(r.titulo || "Sin título")}</h3><div class="row act"></div></article>`).firstChild;
      const th = c.querySelector(".thumb");
      if (r.gen) { const tp = CONTENT.find(x => x.id === r.gen.topic); if (tp) { const k = r.id; th.innerHTML = thumbCache[k] || (thumbCache[k] = svgPage(RB.build(tp, r.gen.grado, r.gen.formato, r.gen.version).pages[0])); } }
      else { const u = r.thumbUrl || (r.thumbId ? "/_blob/" + r.thumbId : ((r.contentType||"").startsWith("image/") ? src : "")); if (u) { const i = document.createElement("img"); i.alt = ""; i.loading = "lazy"; i.src = u; th.appendChild(i); } else th.remove(); }
      const act = c.querySelector(".act");
      const tpg = r.gen && CONTENT.find(x => x.id === r.gen.topic);
      if (tpg) { const b = document.createElement("button"); b.type = "button"; b.className = "lk"; b.style.background = "var(--wa)"; b.style.color = "#fff"; b.textContent = "Descargar PDF"; b.onclick = () => dlBuilt(withF(() => RB.build(tpg, r.gen.grado, r.gen.formato, r.gen.version)), b); act.appendChild(b); }
      else if (src) { const a = document.createElement("a"); a.href = src; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Abrir PDF"; act.appendChild(a); }
      if (r.gen) { const tp = CONTENT.find(x => x.id === r.gen.topic); if (tp) { const b = document.createElement("button"); b.type = "button"; b.className = "lk"; b.textContent = "Cambiar versión"; b.onclick = () => openResource(tp, r.gen.grado, r.gen.formato, r.gen.version); act.appendChild(b); } }
      if (db && ((L.me && r.autor === L.me) || L.canEdit)) {
        const d = document.createElement("button"); d.type = "button"; d.className = "del"; d.textContent = "Quitar"; let armed = false;
        d.onclick = async () => { if (!armed) { armed = true; d.textContent = "¿Seguro? Toca otra vez"; setTimeout(() => { armed = false; d.textContent = "Quitar"; }, 4000); return; } try { await db.doc("recursos/" + r.id).delete(); if (assets && r.assetId) { try { await assets.delete(r.assetId); } catch {} } } catch { d.textContent = "No se pudo quitar"; } };
        act.appendChild(d);
      }
      grid.appendChild(c);
    });
    if (list.length > L.shown) { const m = document.createElement("button"); m.type = "button"; m.className = "pill more"; m.textContent = "Ver más"; m.onclick = () => { L.shown += 24; render(); }; app.appendChild(m); }
  }

  function syncNav(){ const t = S.view === "home" ? "home" : S.view === "favoritos" ? "favoritos" : "explorar"; document.querySelectorAll(".tabbar button").forEach(b => b.classList.toggle("on", b.dataset.tab === t)); }
  document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => { S.q = ""; go(b.dataset.tab); });
  const menu = $("#menu"), burger = $("#burger");
  burger.onclick = () => { const o = menu.hidden; menu.hidden = !o; burger.setAttribute("aria-expanded", o); };
  menu.querySelectorAll("button").forEach(b => b.onclick = () => { menu.hidden = true; burger.setAttribute("aria-expanded", "false"); go(b.dataset.go); });
  if (!(window.claude && window.claude.use)) $("#menu-listos").hidden = true;
  // ---------- animación ----------
  const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let lastView = null, IO = null;
  function animateView(fresh){
    if (RM || !fresh) return;
    app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter");
    if (!IO && "IntersectionObserver" in window) IO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); IO.unobserve(e.target); } }), { rootMargin: "0px 0px -5% 0px" });
    let k = 0; app.querySelectorAll(".tile,.tool,.door2,.fcard,.qcard,.pband,.gthumb,.cmp .r,.mcard,.month li,.plusform,.lv2,.sechead").forEach(e => { e.classList.add("rv"); e.style.setProperty("--d", (k++ % 8) * 55 + "ms"); if (IO) IO.observe(e); else e.classList.add("in"); });
  }
  function confetti(n){
    if (RM) return; const c = document.createElement("div"), cols = ["#ff6f6f", "#f3b93c", "#7cc443", "#3fc6c4", "#8d6fe0", "#ff8fb1", "#4fa3ec", "#ffd23f"];
    c.className = "confetti"; c.setAttribute("aria-hidden", "true");
    for (let i = 0; i < (n || 70); i++) { const s = document.createElement("i"); s.style.left = Math.random() * 100 + "%"; s.style.background = cols[i % cols.length]; s.style.animationDelay = Math.random() * .5 + "s"; s.style.setProperty("--x", (Math.random() * 200 - 100) + "px"); s.style.setProperty("--r", (Math.random() * 900 - 450) + "deg"); if (i % 3 === 0) s.style.borderRadius = "50%"; c.appendChild(s); }
    document.body.appendChild(c); setTimeout(() => c.remove(), 3000);
  }
  function render(){ syncNav(); RB.setFoot(isPlus() ? null : "Hecho con Tizapop · Versión gratis · Uso libre en el aula");
    app.textContent = "";
    ({ home: vHome, area: vArea, res: vRes, listos: vListos, doc: vDoc, salon: vSalon, kinder: vKinder, padres: vPadres, festejos: vFestejos, primaria: vPrimaria, docente: vDocente, plus: vPlus, legal: vLegal, jugar: vJugar, juego: vJuego, alumnos: vAlumnos, explorar: vExplorar, favoritos: vFavoritos }[S.view] || vHome)();
    if (S.view !== "juego") { const ft = el(`<footer class="sitefoot"><p>© 2026 Tizapop · Material didáctico para imprimir</p><p><a href="#" data-lk="terminos">Términos y condiciones</a> · <a href="#" data-lk="privacidad">Aviso de privacidad</a> · <a href="#" data-lk="ayuda">Ayuda y cancelación</a></p><p class="sm">Tizapop no forma parte de la SEP ni de ninguna autoridad educativa.</p></footer>`).firstChild; ft.querySelectorAll("[data-lk]").forEach(a2 => a2.onclick = e => { e.preventDefault(); S.legal = a2.dataset.lk; go("legal"); }); app.appendChild(ft); }
    animateView(S.view !== lastView); lastView = S.view;
    const q = $("#q"); if (q && S.view === "home" && S.q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  render();

  // ---------- compartir ----------
  const TIPOS = ["Memorama","Lotería","Tarjetario","Sopa de letras","Hoja de trabajo","Relacionar columnas","Examen","Cuadernillo","Decoración","Juego","Secuencia didáctica","Plantilla"];
  TIPOS.forEach(t => $("#f-tiposel").add(new Option(t,t))); ALL_AREAS.forEach(t => $("#f-areasel").add(new Option(t,t)));
  const dlg = $("#dlg");
  $("#fab").onclick = () => { $("#formMsg").textContent = ""; try { dlg.showModal(); } catch { dlg.setAttribute("open",""); } };
  $("#cancel").onclick = () => dlg.close();
  $("#shareForm").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = $("#formMsg"), titulo = $("#f-titulo").value.trim(), file = $("#f-file").files[0];
    if (!titulo) { msg.textContent = "Escribe un título."; return; }
    if (!file) { msg.textContent = "Adjunta el archivo (PDF o imagen)."; return; }
    if (file.size > 20*1024*1024) { msg.textContent = "El archivo pesa más de 20 MB."; return; }
    if (!assets) { msg.textContent = "Tu acceso no permite subir archivos. Pide acceso de colaborador."; return; }
    const btn = $("#submitBtn"); btn.disabled = true; btn.textContent = "Subiendo…"; msg.textContent = "";
    try {
      const up = await assets.upload(file);
      const area = $("#f-areasel").value;
      await db.doc("recursos/" + Date.now().toString(36) + Math.random().toString(36).slice(2,7)).set({ titulo, materia: area, area, tipo: $("#f-tiposel").value, nivel: $("#f-nivelsel").value, grado: $("#f-grado").value.trim(), descripcion: $("#f-desc").value.trim(), assetId: up.id, assetUrl: up.url, contentType: up.contentType || file.type, autor: L.me || "", creado: Date.now() });
      $("#shareForm").reset(); dlg.close(); S.view = "listos"; L.area = null; render();
    } catch (err) {
      const c = err && err.code;
      msg.textContent = c === "unsupported_type" ? "Usa PDF, PNG o JPG." : c === "quota_exceeded" ? "Se llenó el espacio del banco." : c === "invalid_argument" || c === "not_granted" ? "Tu acceso no permite publicar aquí." : "No se pudo publicar. Inténtalo otra vez.";
    } finally { btn.disabled = false; btn.textContent = "Publicar"; }
  });

  // ---------- capacidades ----------
  (async () => {
    if (!window.claude || !window.claude.use) { notice = "Abre esta página en Claude para ver la biblioteca."; L.loaded = true; if (S.view === "listos") render(); return; }
    [db, user, assets, downloads] = await Promise.all(["db","user","assets","downloads"].map(n => claude.use(n)));
    if (S.view === "res" || S.view === "doc") render();
    if (!db) { notice = "Inicia sesión para ver la biblioteca."; L.loaded = true; if (S.view === "listos") render(); return; }
    let canWrite = true;
    if (user) { try { L.me = await user.id(); } catch {} try { L.canEdit = !!(await user.canEdit()); } catch {} try { canWrite = (await user.can("data.write")) !== false; } catch {} }
    $("#fab").hidden = !(canWrite && assets);
    db.collection("recursos").orderBy("creado","desc").limit(500).onSnapshot(snap => {
      L.items = snap.docs.map(d => ({ id: d.id, ...d.data() })); L.loaded = true; if (S.view === "listos") render();
    }, () => { notice = "No se pudo cargar la biblioteca. Recarga la página."; L.loaded = true; if (S.view === "listos") render(); });
  })();
})();
</script>
