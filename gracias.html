<style>
:root{--ink:#2e1a47;--mut:#6d6585;--bd:#ece6f3;--bg:#fdf8f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{background:#fff;border:1px solid var(--bd);border-radius:24px;box-shadow:0 10px 30px rgba(46,37,80,.08);max-width:480px;width:100%;padding:28px 22px;display:grid;gap:14px;text-align:center;justify-items:center}
img{width:180px;height:auto}h1{margin:0;font-size:28px;line-height:1.15}p{margin:0;color:var(--mut)}
.ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:#ffd23f}
.ic.ok{background:#bdf0d6}.ic.wait{background:#ffe7a8}.ic.no{background:#ffd0d0}
.code{background:#f3ecfd;border-radius:16px;padding:14px 18px;display:grid;gap:4px;width:100%}.code b{font-size:24px;letter-spacing:.06em;word-break:break-all}.code small{color:var(--mut)}
a.btn,button{display:inline-block;border:0;border-radius:99px;background:var(--ink);color:#fff;font:700 17px/1 inherit;padding:15px 26px;text-decoration:none;cursor:pointer}
button.alt{background:#efe7fa;color:var(--ink);font-size:15px;padding:10px 18px;justify-self:center}
@media (prefers-reduced-motion:no-preference){main{animation:inn .5s cubic-bezier(.2,.8,.2,1) both}.ic{animation:pop .6s .15s cubic-bezier(.2,.8,.2,1.4) both}.code b{animation:pop .6s .3s both}}
@keyframes inn{from{opacity:0;transform:translateY(14px)}}@keyframes pop{from{opacity:0;transform:scale(.4)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:3px;animation:fall 2.4s cubic-bezier(.3,.6,.6,1) forwards}@keyframes fall{to{transform:translate(var(--x),106vh) rotate(var(--r))}}
</style>
</head>

<script>
(function(){
  var q = new URLSearchParams(location.search), m = document.getElementById("m"), logo = document.querySelector("img").src;
  var pid = q.get("preapproval_id") || q.get("preapproval-id") || "";
  var LS = function(k, v){ try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); };
  function show(ic, title, text, extra, noBtn){ m.innerHTML = '<img src="' + logo + '" alt="Tizapop" width="640" height="224"><div class="ic ' + ic + '">' + ({ ok:"✓", wait:"⏳", no:"!" }[ic]) + '</div><h1>' + title + '</h1><p>' + text + '</p>' + (extra || "") + (noBtn ? "" : '<a class="btn" href="./">Ir a Tizapop</a>'); }
  function confetti(){ if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return; var c = document.createElement("div"), cols = ["#ff6f6f","#f3b93c","#7cc443","#3fc6c4","#8d6fe0","#ff8fb1","#4fa3ec","#ffd23f"]; c.className = "confetti";
    for (var i = 0; i < 90; i++) { var e = document.createElement("i"); e.style.left = Math.random() * 100 + "%"; e.style.background = cols[i % 8]; e.style.animationDelay = Math.random() * .5 + "s"; e.style.setProperty("--x", (Math.random() * 200 - 100) + "px"); e.style.setProperty("--r", (Math.random() * 900 - 450) + "deg"); c.appendChild(e); } document.body.appendChild(c); setTimeout(function(){ c.remove(); }, 3200); }
  function listo(code){ setTimeout(confetti, 200); LS("tz-plus", JSON.stringify(code)); LS("tz-chk", JSON.stringify(Date.now()));
    show("ok", "¡Bienvenida a Tizapop Plus!", "Tu suscripción está activa y todo quedó desbloqueado en este navegador.", '<div class="code"><small>Tu código de acceso</small><b>' + esc(code) + '</b><button class="alt" id="cp" type="button">Copiar código</button><small>Guárdalo (toma captura). Sirve para activar Plus en otro celular o computadora.</small></div>');
    var cp = document.getElementById("cp"); cp.onclick = function(){ if (navigator.clipboard) navigator.clipboard.writeText(code).then(function(){ cp.textContent = "¡Copiado!"; }); }; }
  function porCorreo(msg){
    show("wait", "Activa tu suscripción", msg || "Escribe el correo de tu cuenta de Mercado Pago con el que te suscribiste.", '<form id="f" style="display:grid;gap:10px;width:100%"><label for="em" style="text-align:left;font-weight:700">Correo<input id="em" type="email" required autocomplete="email" style="display:block;width:100%;margin-top:4px;padding:12px;border:1px solid #ddd;border-radius:12px;font:inherit"></label><button type="submit">Activar</button><p id="er" style="margin:0"></p></form>', false);
    document.getElementById("f").onsubmit = function(e){ e.preventDefault(); var er = document.getElementById("er"); er.textContent = "Revisando…";
      fetch("/.netlify/functions/verificar?email=" + encodeURIComponent(document.getElementById("em").value), { cache: "no-store" }).then(function(r){ return r.json(); }).then(function(j){
        if (j.status === "authorized" && j.code) listo(j.code); else er.textContent = "No encontramos una suscripción activa con ese correo. Si acabas de pagar, espera un minuto e inténtalo de nuevo.";
      }).catch(function(){ er.textContent = "No pudimos revisar. Revisa tu conexión."; }); };
  }
  if (!pid) { porCorreo(); return; }
  fetch("/.netlify/functions/verificar?preapproval_id=" + encodeURIComponent(pid), { cache: "no-store" }).then(function(r){ return r.json(); }).then(function(j){
    if (j.status === "authorized" && j.code) listo(j.code);
    else if (j.status === "pending") porCorreo("Tu suscripción se está procesando. En un momento escribe aquí el correo de tu cuenta de Mercado Pago para activarla.");
    else if (j.status === "not_found") porCorreo();
    else show("no", "La suscripción no se completó", "No se hizo ningún cargo. Puedes intentarlo de nuevo desde Tizapop › Tizapop Plus.");
  }).catch(function(){ porCorreo("No pudimos confirmar tu suscripción automáticamente. Escribe el correo de tu cuenta de Mercado Pago para activarla."); });
})();
</script>
